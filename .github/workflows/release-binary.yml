name: Release CLI binaries

# Builds the standalone CLI binary (`sghtmltopdf`) for each platform on tag
# push and attaches it to a GitHub Release. This is for users who just want a
# single binary to ship, separate from the gem (bindings/ruby) or the Docker
# image (e.g. a Rails app that drops it on a Heroku dyno and shells out to it).
#
# Usage: `git tag binary-vX.Y.Z && git push origin binary-vX.Y.Z`.

on:
  push:
    tags:
      - "binary-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # aarch64-linux needs a cross linker (since we build it on an amd64 host).
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # Include only the CLI (no `server` feature, since we don't need the HTTP server).
      - name: Build
        run: cargo build --release --locked --no-default-features --features cli --bin sghtmltopdf --target ${{ matrix.target }}

      - name: Package
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          tar -C "$bin_dir" -czf "sghtmltopdf-${{ matrix.target }}.tar.gz" sghtmltopdf
          sha256sum "sghtmltopdf-${{ matrix.target }}.tar.gz" > "sghtmltopdf-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sghtmltopdf-${{ matrix.target }}.tar.gz
            sghtmltopdf-${{ matrix.target }}.tar.gz.sha256
